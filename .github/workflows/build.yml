name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create --org br.agro --project-name agrodetect_ai --platforms=android .

      - name: Aplicar permissoes e minSdk
        run: |
          python3 - <<'PY'
          import re, os
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          perms = open('ANDROID_MANIFEST_PERMISSOES.xml').read()
          perms = '\n'.join(l for l in perms.splitlines() if not l.strip().startswith('<!--'))
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
          s = s.replace('android:label="agrodetect_ai"', 'android:label="AgroDetect AI"')
          open(m, 'w').write(s)
          for f in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              if os.path.exists(f):
                  t = open(f).read()
                  t = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24', t)
                  t = re.sub(r'compileSdk(Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 36', t)
                  t = re.sub(r'compileSdk(Version)?\s*=?\s*\d+', 'compileSdk = 36', t)
                  open(f, 'w').write(t)
          PY

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: AgroDetectAI-apk
          path: build/app/outputs/flutter-apk/app-release.apk
