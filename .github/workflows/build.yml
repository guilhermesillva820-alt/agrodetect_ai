name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create --org br.agro --project-name agrodetect_ai --platforms=android .

      - name: Aplicar permissoes e SDKs
        run: |
          python3 - <<'PY'
          import re, os

          # 1. Permissões e nome do App
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          perms = open('ANDROID_MANIFEST_PERMISSOES.xml').read()
          perms = '\n'.join(l for l in perms.splitlines() if not l.strip().startswith('<!--'))
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
          s = s.replace('android:label="agrodetect_ai"', 'android:label="AgroDetect AI"')
          open(m, 'w').write(s)

          # 2. Forçar compileSdk 36 e minSdk 24 no build.gradle / build.gradle.kts
          for f in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              if os.path.exists(f):
                  t = open(f).read()
                  t = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 24', t)
                  t = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 24', t)
                  t = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', t)
                  t = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', t)
                  open(f, 'w').write(t)
                  print(f"--- Conteudo atualizado de {f} ---")
                  print(t)

          # 3. Garantir no gradle.properties também
          gp = 'android/gradle.properties'
          if os.path.exists(gp):
              with open(gp, 'a') as f_gp:
                  f_gp.write('\nflutter.compileSdkVersion=36\nflutter.minSdkVersion=24\n')
          PY

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: AgroDetectAI-apk
          path: build/app/outputs/flutter-apk/app-release.apk
